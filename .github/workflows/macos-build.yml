name: macOS Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and package
        run: ./scripts/project_finalize.sh

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCatPet
          path: releases/build/*.zip
